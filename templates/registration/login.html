{% extends "base.html" %}
 
{% block content %}
<section class="auth-panel">
<h2>Log in</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</section>
{% endblock %}
