<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #37352f;
            background: #fff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }

        a { color: #37352f; text-underline-offset: 3px; }
        a:hover { color: #77756f; }

        .site-header {
            min-height: 58px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid #ededea;
        }

        .brand {
            font-weight: 650;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-nav form { margin: 0; }
        .site-nav a, .text-button {
            color: #5f5e59;
            font: inherit;
            text-decoration: none;
        }

        .text-button {
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
        }

        .page-content {
            width: min(100% - 40px, 760px);
            margin: 56px auto;
        }

        h1, h2, h3 { color: #292824; line-height: 1.3; letter-spacing: -0.025em; }
        h1 { margin: 0 0 12px; font-size: 30px; }
        h2 { margin: 0 0 20px; font-size: 25px; }
        h3 { font-size: 18px; }
        p { margin: 12px 0; }

        .auth-panel { width: min(100%, 440px); margin: 40px auto; }
        .muted { color: #85837c; }

        form p { margin: 0 0 16px; }
        label { display: block; margin-bottom: 5px; font-weight: 550; }
        input:not([type="checkbox"]):not([type="radio"]), select, textarea {
            width: 100%;
            min-height: 40px;
            padding: 8px 11px;
            border: 1px solid #deded9;
            border-radius: 5px;
            background: #fff;
            color: inherit;
            font: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #c9c8c2;
            outline-offset: 1px;
        }
        input[type="checkbox"], input[type="radio"] { accent-color: #37352f; }
        button:not(.text-button), .button {
            display: inline-block;
            padding: 8px 14px;
            border: 1px solid #37352f;
            border-radius: 5px;
            background: #37352f;
            color: #fff;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        button:not(.text-button):hover, .button:hover { background: #55534d; color: #fff; }
        ul { padding-left: 22px; }
        li { margin: 6px 0; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ededea; }
        th { color: #77756f; font-size: 13px; font-weight: 550; }
        .notice {
            margin: 0 0 20px;
            padding: 10px 13px;
            border: 1px solid #e8e7e2;
            border-radius: 5px;
            background: #f7f7f5;
        }

        @media (max-width: 520px) {
            .site-header { padding: 0 16px; }
            .site-nav { gap: 11px; }
            .page-content { width: min(100% - 32px, 760px); margin: 36px auto; }
            h1 { font-size: 26px; }
            table { font-size: 13px; }
            th, td { padding: 8px 6px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">CampusConnect</a>
        <nav class="site-nav" aria-label="Main navigation">
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Profile</a> |
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button class="text-button" type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
        </nav>
    </header>
    <main class="page-content">
        {% if messages %}
            {% for message in messages %}
                <p class="notice">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
